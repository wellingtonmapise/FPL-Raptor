[project]
name = "raptor-jobs"
version = "0.1.0"
description = "Scheduled jobs for FPL Raptor: fetch FPL data into Supabase"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
