[project]
name = "raptor-jobs"
version = "0.1.0"
description = "Scheduled jobs for FPL Raptor: fetch FPL data into Supabase"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "pywebpush>=2",
    "requests>=2.32",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = [
    "pyjwt>=2.8",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
